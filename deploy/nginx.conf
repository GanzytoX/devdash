map $uri $devdash_cache_control {
    default "no-store";
    ~^/assets/ "public, max-age=31536000, immutable";
}

map $http_x_real_ip $devdash_real_ip {
    default $http_x_real_ip;
    "" $remote_addr;
}

map $http_x_forwarded_for $devdash_forwarded_for {
    default $http_x_forwarded_for;
    "" $remote_addr;
}

map $http_x_forwarded_proto $devdash_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control $devdash_cache_control always;

    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $devdash_real_ip;
        proxy_set_header X-Forwarded-For $devdash_forwarded_for;
        proxy_set_header X-Forwarded-Proto $devdash_forwarded_proto;
    }

    location = /health {
        proxy_pass http://backend:3001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $devdash_real_ip;
        proxy_set_header X-Forwarded-For $devdash_forwarded_for;
        proxy_set_header X-Forwarded-Proto $devdash_forwarded_proto;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
